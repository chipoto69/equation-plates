<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation Plates — Metanomicon</title>
<style>
  :root { --void:#070708; --ink:#e6e1d6; --hair:#2a2824; --cyan:#7ec8c3; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--void); color:var(--ink); font:12px/1.45 ui-monospace, "IBM Plex Mono", monospace; }
  header, main, footer { width:min(920px, calc(100% - 32px)); margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; padding:22px 0 14px; border-bottom:1px solid var(--hair); letter-spacing:.08em; text-transform:uppercase; }
  .mark { color:var(--cyan); }
  .draft { color:var(--cyan); opacity:.7; }
  figure { margin:28px 0 8px; }
  canvas { width:100%; height:auto; display:block; background:#0b0b0c; }
  figcaption { display:flex; justify-content:space-between; gap:16px; padding:10px 0 22px; border-bottom:1px solid var(--hair); color:#b7b1a6; }
  figcaption b { color:var(--ink); font-weight:500; }
  eq { color:var(--cyan); }
  ol { list-style:none; padding:0; margin:18px 0 40px; }
  li { display:grid; grid-template-columns: 92px 1fr auto; gap:12px; padding:8px 0; border-bottom:1px solid var(--hair); }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--cyan); }
  footer { padding-bottom:40px; color:#8d877c; }
</style>
</head>
<body>
<header>
  <span class="mark">[[. ]] metanomicon</span>
  <span>equation plates</span>
  <span class="draft">draft / renders</span>
</header>
<main>
  <figure>
    <canvas id="plate" width="900" height="900"></canvas>
    <figcaption>
      <span><b id="fam">clifford</b> · seed <span id="seed">20261004</span></span>
      <span class="eq" id="eq">x' = sin(ay)+c cos(ax)</span>
    </figcaption>
  </figure>
  <ol id="reg"></ol>
</main>
<footer>plates.metanomicon.org · ink on void · one accent · seed is the work id</footer>
<script>
const plates = [
  { family:"clifford", seed:"20261004", a:-1.4, b:1.6, c:1.0, d:0.7, eq:"x' = sin(ay) + c cos(ax)" },
  { family:"dejong", seed:"20261004b", a:1.4, b:-2.3, c:2.4, d:-2.1, eq:"x' = sin(ay) - cos(bx)" },
  { family:"clifford", seed:"lace-17", a:-1.7, b:1.3, c:-0.1, d:-1.2, eq:"x' = sin(ay) + c cos(ax)" },
  { family:"clifford", seed:"twin-17", a:1.7, b:1.7, c:0.6, d:1.2, eq:"x' = sin(ay) + c cos(ax)" }
];
function draw(p) {
  const c = document.getElementById("plate");
  const ctx = c.getContext("2d");
  const w = c.width, h = c.height;
  const img = ctx.createImageData(w, h);
  let x = 0.1, y = 0.1;
  const pts = [];
  for (let i = 0; i < 1200; i++) step();
  for (let i = 0; i < 180000; i++) { step(); pts.push(x, y); }
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for (let i = 0; i < pts.length; i += 2) {
    minx=Math.min(minx,pts[i]); maxx=Math.max(maxx,pts[i]);
    miny=Math.min(miny,pts[i+1]); maxy=Math.max(maxy,pts[i+1]);
  }
  const bins = new Uint32Array(w*h);
  for (let i = 0; i < pts.length; i += 2) {
    const px = Math.floor((pts[i]-minx)/(maxx-minx+1e-9)*(w-8)+4);
    const py = Math.floor((pts[i+1]-miny)/(maxy-miny+1e-9)*(h-8)+4);
    if (px>=0 && py>=0 && px<w && py<h) bins[py*w+px]++;
  }
  for (let i = 0; i < bins.length; i++) {
    const v = Math.log1p(bins[i]) / Math.log1p(40);
    const k = Math.min(1, v);
    const o = i*4;
    img.data[o] = Math.floor(11 + k*214);
    img.data[o+1] = Math.floor(11 + k*198);
    img.data[o+2] = Math.floor(12 + k*170);
    img.data[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById("fam").textContent = p.family;
  document.getElementById("seed").textContent = p.seed;
  document.getElementById("eq").textContent = p.eq + "  a="+p.a+" b="+p.b+" c="+p.c+" d="+p.d;
  function step() {
    const nx = p.family === "dejong" ? Math.sin(p.a*y) - Math.cos(p.b*x) : Math.sin(p.a*y) + p.c*Math.cos(p.a*x);
    const ny = p.family === "dejong" ? Math.sin(p.c*x) - Math.cos(p.d*y) : Math.sin(p.b*x) + p.d*Math.cos(p.b*y);
    x = nx; y = ny;
  }
}
const reg = document.getElementById("reg");
plates.forEach((p, i) => {
  const li = document.createElement("li");
  li.innerHTML = `<a href="#${p.seed}">${p.family}</a><span>${p.seed} · ${p.a}, ${p.b}, ${p.c}, ${p.d}</span><span>draft</span>`;
  li.querySelector("a").onclick = (e) => { e.preventDefault(); draw(p); };
  reg.appendChild(li);
});
draw(plates[0]);
</script>
</body>
</html>
