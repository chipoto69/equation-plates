<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0B09">
<title>Septenary hold</title>
<style>
:root { --void:#0C0B09; --ink:#E9E5DC; --worn:#9B9588; --gilt:#C8A24B; --hair:#2c2924; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--void); color:var(--ink); }
body { font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; min-height:100dvh; }
main { width:min(520px,100%); margin:0 auto; padding:calc(8px + env(safe-area-inset-top)) 16px 32px; }
.navline { display:flex; align-items:center; min-height:44px; }
.back { color:var(--gilt); text-decoration:none; font-size:17px; min-height:44px; display:inline-flex; align-items:center; }
.navline span { margin:0 auto; font-weight:600; transform:translateX(-28px); }
canvas { width:100%; aspect-ratio:1; display:block; border-radius:16px; background:#0C0B09; }
.law { font-family:Georgia,"IBM Plex Serif",serif; font-style:italic; color:var(--gilt); font-size:20px; line-height:1.35; margin:14px 4px 6px; }
.meta { color:var(--worn); font-size:13px; margin:0 4px 8px; }
.dl { margin:16px 4px 0; min-height:44px; padding:0 16px; border:1px solid var(--hair); border-radius:999px; background:#161410; color:var(--ink); font:inherit; font-size:15px; }
.dl:active { background:#221f1a; }
</style>
</head><body>
<main>
<div class="navline"><a class="back" href="/">‹ Plates</a><span>superformula</span></div>
<canvas id="plate" width="800" height="800" aria-label="Septenary hold"></canvas>
<p class="law">r = (|cos(m φ/4)|<sup>n2</sup> + |sin(m φ/4)|<sup>n3</sup>)<sup>−1/n1</sup></p>
<p class="meta">20261005 · Septenary hold · a 7.119 b 0.532 c 1.507 d 0.444</p>
<button class="dl" type="button" id="download">Download image</button>
</main>
<script>
const p = { a: 7.119, b: 0.532, c: 1.507, d: 0.444 };
const canvas = document.getElementById("plate");
const ctx = canvas.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let frame = 0;
function draw(target, phase) {
  const c = target.getContext("2d");
  const w = target.width;
  c.fillStyle = "#0C0B09";
  c.fillRect(0, 0, w, w);
  const m = p.a, n1 = Math.abs(p.b) + 0.35, n2 = Math.abs(p.c) + 0.35, n3 = Math.abs(p.d) + 0.35;
  for (let ring = 0; ring < 6; ring++) {
    c.beginPath();
    const scale = 0.16 + ring * 0.038;
    for (let i = 0; i <= 720; i++) {
      const phi = (i / 720) * Math.PI * 2 + phase * (1 + ring * 0.04);
      const t = Math.abs(Math.cos((m + ring * 0.12) * phi / 4)) ** (n2 + ring * 0.04) + Math.abs(Math.sin((m + ring * 0.12) * phi / 4)) ** n3;
      const r = Math.max(0.08, Math.min(4.2, (t + 1e-4) ** (-1 / n1)));
      const x = w / 2 + Math.cos(phi) * r * w * scale * 0.42;
      const y = w / 2 + Math.sin(phi) * r * w * scale * 0.42;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
    c.lineWidth = ring === 5 ? Math.max(2.4, w / 220) : Math.max(0.9, w / 640);
    c.strokeStyle = ring === 5 ? "#C8A24B" : "rgba(233,229,220," + (0.16 + ring * 0.09) + ")";
    c.stroke();
  }
}
function tick() {
  draw(canvas, reduce ? 0 : frame * 0.008);
  frame++;
  if (!reduce) requestAnimationFrame(tick);
}
tick();
function plateFile() {
  const out = document.createElement("canvas");
  out.width = 1600; out.height = 1800;
  const c = out.getContext("2d");
  c.fillStyle = "#0C0B09";
  c.fillRect(0, 0, 1600, 1800);
  const shot = document.createElement("canvas");
  shot.width = 1600; shot.height = 1600;
  draw(shot, reduce ? 0 : frame * 0.008);
  c.drawImage(shot, 0, 0);
  c.fillStyle = "#C8A24B";
  c.font = "italic 42px Georgia, serif";
  c.fillText("r = (|cos(m \u03c6/4)|^n2 + |sin(m \u03c6/4)|^n3)^(\u22121/n1)", 64, 1688);
  c.fillStyle = "#9B9588";
  c.font = "28px -apple-system, sans-serif";
  c.fillText("20261005  ·  a 7.119  b 0.532  c 1.507  d 0.444", 64, 1744);
  return new Promise(resolve => out.toBlob(resolve, "image/png"));
}
document.getElementById("download").onclick = async () => {
  const blob = await plateFile();
  const file = new File([blob], "20261005-septenary-hold.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Septenary hold" }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};
</script>
</body></html>
