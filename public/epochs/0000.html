// Ink ledger (alpha): running density of the folded orbit (.997), tanh tonemap. Density is ink.
vec4 P=texture(uPatina,FC.xy/r);

float px=2./min(r.x,r.y),n=floor(t*60.+.5),D=0.,e=9.,k;

<script>
"use strict";
// RelicForge host · MIT. Epoch register for this file; the id lives in the URL hash and the git tag epoch-0000.
const EPOCHS={"0000":{seed:"d73058",uSeed:0xd73058/16777216,plate:[-2.113,1.281,1.412,-0.616],folds:2,name:"Tessera"}};
let id=(location.hash||"").replace("#","");
if(!EPOCHS[id]){id="0000";history.replaceState(null,"","#0000");}
const E=EPOCHS[id];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const body=document.getElementById("fs").textContent;
document.getElementById("body").textContent=body;
const tog=document.getElementById("tog"),src=document.getElementById("src");
tog.onclick=()=>{const on=src.hidden;src.hidden=!on;tog.setAttribute("aria-expanded",String(on));};
const cv=document.getElementById("plate");
function size(){const css=cv.getBoundingClientRect().width||402;const cap=css<760?Math.min(900,Math.max(640,css*(devicePixelRatio||1))):Math.min(1200,css*(devicePixelRatio||1));return Math.round(cap);}
const N=size();cv.width=cv.height=N;
const HEAD=`#version 300 es
precision highp float;
uniform vec2 r;uniform float t;
uniform int uEpoch;uniform float uSeed;uniform vec4 uPlate;uniform sampler2D uPatina;uniform vec2 uPointer;
out vec4 o;
#define FC gl_FragCoord
vec3 hsv(float h,float s,float v){vec4 t=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(vec3(h)+t.xyz)*6.-vec3(t.w));return v*mix(vec3(t.x),clamp(p-vec3(t.x),0.,1.),s);}
mat2 rotate2D(float r){return mat2(cos(r),sin(r),-sin(r),cos(r));}
mat3 rotate3D(float angle,vec3 axis){vec3 a=normalize(axis);float s=sin(angle),c=cos(angle),r=1.-c;return mat3(a.x*a.x*r+c,a.y*a.x*r+a.z*s,a.z*a.x*r-a.y*s,a.x*a.y*r-a.z*s,a.y*a.y*r+c,a.z*a.y*r+a.x*s,a.x*a.z*r+a.y*s,a.y*a.z*r-a.x*s,a.z*a.z*r+c);}
void main(){
`;
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const PRESENT=`#version 300 es
precision highp float;uniform sampler2D s;uniform vec2 r;out vec4 o;
void main(){o=vec4(texture(s,gl_FragCoord.xy/r).rgb,1.);}`;
let gl=null,status="init";
function fallback(why){
  // Never a black frame: CPU density of the same folded orbit, same seed.
  status="fallback:"+why;document.documentElement.dataset.status=status;
  let c=cv.getContext("2d");if(!c){const n2=cv.cloneNode();cv.replaceWith(n2);c=n2.getContext("2d");}if(!c)return;const w=cv.width,img=c.createImageData(w,w),H=new Float32Array(w*w);
  const [a,b,cc,d]=E.plate,sx=1/(1+Math.abs(cc)),sy=1/(1+Math.abs(d));let x=.1,y=.1,mx=0;
  for(let i=0;i<1200000;i++){const nx=Math.sin(a*y)+cc*Math.cos(a*x),ny=Math.sin(b*x)+d*Math.cos(b*y);x=nx;y=ny;if(i<1000)continue;
    let qx=x*sx*.75,qy=y*sy*.75;for(let j=0;j<E.folds;j++){qx=Math.abs(qx+qx)-1;qy=Math.abs(qy+qy)-1;}
    const px=Math.floor((qx*.9*.5+.5)*w),py=Math.floor((.5-qy*.9*.5)*w);if(px>=0&&py>=0&&px<w&&py<w){const k=py*w+px;H[k]++;if(H[k]>mx)mx=H[k];}}
  const g=[12,11,9],ink=[233,229,220],m=Math.log(1+mx);
  for(let k=0;k<w*w;k++){const v=Math.tanh(1.8*Math.log(1+H[k])/m);for(let ch=0;ch<3;ch++)img.data[k*4+ch]=g[ch]+(ink[ch]-g[ch])*v;img.data[k*4+3]=255;}
  c.putImageData(img,0,0);
}
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}

try{
  gl=cv.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true,alpha:false});
  if(!gl)throw new Error("no webgl2");
  let fmt=null;
  if(gl.getExtension("EXT_color_buffer_float"))fmt=[gl.RGBA32F,gl.FLOAT];
  else if(gl.getExtension("EXT_color_buffer_half_float"))fmt=[gl.RGBA16F,gl.HALF_FLOAT];
  if(!fmt)throw new Error("no float target");
  const P=prog(HEAD+body+"\n}"),Q=prog(PRESENT);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const tex=[],fb=[];
  for(let i=0;i<2;i++){const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,fmt[0],N,N,0,gl.RGBA,fmt[1],null);
    for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.NEAREST],[gl.TEXTURE_MAG_FILTER,gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
    const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error("fbo incomplete");
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT); // patina starts empty, once; never wiped again
    tex.push(tx);fb.push(f);}
  const U=n=>gl.getUniformLocation(P,n);
  const uR=U("r"),uT=U("t"),uE=U("uEpoch"),uS=U("uSeed"),uPl=U("uPlate"),uPa=U("uPatina"),uPo=U("uPointer");
  const pointer=[9,9];
  cv.addEventListener("pointermove",ev=>{const b=cv.getBoundingClientRect();pointer[0]=((ev.clientX-b.left)/b.width*2-1);pointer[1]=(1-(ev.clientY-b.top)/b.height*2);});
  cv.addEventListener("pointerleave",()=>{pointer[0]=pointer[1]=9;});
  cv.addEventListener("pointerup",ev=>{if(ev.pointerType!=="mouse")pointer[0]=pointer[1]=9;});
  let frame=0,cur=0;
  function pass(){
    gl.useProgram(P);gl.bindFramebuffer(gl.FRAMEBUFFER,fb[1-cur]);gl.viewport(0,0,N,N);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[cur]);
    gl.uniform2f(uR,N,N);gl.uniform1f(uT,frame/60);gl.uniform1i(uE,parseInt(id,10));gl.uniform1f(uS,E.uSeed);
    gl.uniform4f(uPl,...E.plate);gl.uniform1i(uPa,0);gl.uniform2f(uPo,pointer[0],pointer[1]);
    gl.drawArrays(gl.TRIANGLES,0,3);cur=1-cur;frame++;
  }
  function present(){gl.useProgram(Q);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,N,N);gl.bindTexture(gl.TEXTURE_2D,tex[cur]);
    gl.uniform1i(gl.getUniformLocation(Q,"s"),0);gl.uniform2f(gl.getUniformLocation(Q,"r"),N,N);gl.drawArrays(gl.TRIANGLES,0,3);}
  for(let i=0;i<24;i++)pass(); // warm the ledger before the first present: no black first frame
  present();
  const err=gl.getError();if(err)throw new Error("gl error "+err);
  status="webgl2";document.documentElement.dataset.status=status;
  // prefers-reduced-motion: settle the ink, then freeze; the still plate remains.
  const STILL=480;
  function tick(){
    if(reduce){for(let i=0;i<6&&frame<STILL;i++)pass();present();if(frame<STILL)requestAnimationFrame(tick);return;}
    pass();present();requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.__relic={frames:()=>frame,pass,present};
  gl.canvas.addEventListener("webglcontextlost",e=>{e.preventDefault();fallback("context lost");});
}catch(err){console.error(err);gl=null;fallback(String(err&&err.message||err));}
</script>
